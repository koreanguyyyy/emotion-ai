spring:
  datasource:
    url: jdbc:mysql://localhost:3306/capstone?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: capstone
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      pool-name: CapstoneHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true


server:
  port: 8080


logging:
  level:
    com.capstone.backend: INFO
    org.hibernate.sql: WARN
    com.zaxxer.hikari: INFO
  file:
    name: logs/backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} [%level] $logger{36} - %msg%n"





